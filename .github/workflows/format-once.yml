name: One-time Ruff formatting

on:
  push:
    branches:
      - agent/argument-injection-skill
    paths:
      - .github/workflows/format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Format files flagged by Ruff
        run: |
          uv run ruff format \
            strix/agents/factory.py \
            strix/config/models.py \
            strix/config/settings.py \
            strix/core/execution.py \
            strix/core/inputs.py \
            strix/tools/agents_graph/tools.py \
            strix/tools/reporting/tool.py \
            tests/test_context_budget.py \
            tests/test_execution.py \
            tests/test_reporting_fields.py

      - name: Commit formatting and remove this one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            strix/agents/factory.py \
            strix/config/models.py \
            strix/config/settings.py \
            strix/core/execution.py \
            strix/core/inputs.py \
            strix/tools/agents_graph/tools.py \
            strix/tools/reporting/tool.py \
            tests/test_context_budget.py \
            tests/test_execution.py \
            tests/test_reporting_fields.py
          git rm .github/workflows/format-once.yml
          git commit -m "style: format Python modules with Ruff"
          git push origin HEAD:refs/heads/agent/argument-injection-skill

      - name: Verify tests
        run: uv run pytest

      - name: Verify Ruff lint
        run: uv run ruff check .

      - name: Verify Ruff formatting
        run: uv run ruff format --check .

      - name: Verify Mypy
        run: uv run mypy strix/

      - name: Verify Pyright baseline
        continue-on-error: true
        run: uv run pyright strix/

      - name: Verify Bandit
        run: uv run bandit -r strix/ -c pyproject.toml

name: Temporary pytest failure diagnostics

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pytest-diagnostic.yml

permissions:
  contents: read

jobs:
  pytest-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.12'
      - name: Stop after the first 20 test failures and print full tracebacks
        run: uv run --frozen pytest -q --tb=short --maxfail=20

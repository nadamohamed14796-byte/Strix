name: Tests & Quality

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}-v3
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest

      - name: Ruff lint
        run: uv run ruff check .

      - name: Preview controller formatting
        run: |
          uv run ruff format strix/interface/tui/backend/controller.py
          git diff -- strix/interface/tui/backend/controller.py

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy strix/

      - name: Pyright (existing project-wide baseline debt; non-blocking)
        continue-on-error: true
        run: uv run pyright strix/

      - name: Bandit
        run: uv run bandit -r strix/ -c pyproject.toml
